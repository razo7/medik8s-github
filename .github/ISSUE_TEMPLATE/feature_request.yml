name: Feature Request
description: Suggest a new feature or enhancement
labels: ["kind/feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. For large changes, please open a
        [discussion issue](https://github.com/medik8s/.github/blob/main/CONTRIBUTING.md#finding-something-to-work-on)
        first so the community can weigh in before you start coding.

  - type: input
    id: operator
    attributes:
      label: Operator
      description: Which operator does this apply to? Leave blank for cross-cutting features.
      placeholder: "e.g. NHC, SNR, FAR, MDR, NMO, SBR, all"

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: |
        As a [developer/user/operator], I would like to ...
        so that ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you think this should work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches have you considered?

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any references, links, or examples.
